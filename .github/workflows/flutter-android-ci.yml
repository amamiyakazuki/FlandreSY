name: Flutter Android CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Analyze, test and Android debug
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Override the local 8 GiB heap only for this CI process.
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m"
        -Dorg.gradle.workers.max=2
        -Dorg.gradle.parallel=false
        -Dorg.gradle.daemon=false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Verify toolchain
        run: |
          flutter config --jdk-dir "$JAVA_HOME"
          flutter --version
          java -version

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run all tests
        run: flutter test --no-pub --reporter expanded

      - name: Prepare Android SDK
        # The runner image installs command-line tools outside the default PATH.
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo '::error::Android SDK root is not configured on this runner'
            exit 1
          fi
          sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdk_manager" ]]; then
            echo "::error::Android SDK manager is not executable: $sdk_manager"
            exit 1
          fi
          "$sdk_manager" --sdk_root="$sdk_root" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'

      - name: Build Android debug ARM64
        run: flutter build apk --debug --target-platform android-arm64 --no-pub

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flandresy-debug-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
