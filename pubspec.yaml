name: flandresy
description: FlandreSY 2.0 Flutter rewrite.
publish_to: none
version: 2.1.4+6

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  http: ^1.6.0
  package_info_plus: ^9.0.0
  pub_semver: ^2.2.0
  url_launcher: ^6.3.2
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  # 住理热水真实 BLE/GATT 传输，由生产入口显式注入。
  flutter_blue_plus: ^1.32.12
  # token/secret 加密持久化：Android Keystore / iOS Keychain。
  flutter_secure_storage: ^10.3.1
  # 真实相机扫码(RSCAN)。默认不触发:测试/golden 永不 pump 扫码页;点击扫码卡/添加设备才打开相机,
  # classifyScanRouting 分类后路由到显式注入的真实适配器。
  # Android CAMERA 权限 + iOS NSCameraUsageDescription 已声明。
  mobile_scanner: ^7.2.0
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  golden_toolkit: ^0.15.0
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/legacy/images/
    - assets/public/version.json
  fonts:
    - family: FutureRoundSC
      fonts:
        - asset: assets/legacy/fonts/future_round_sc_regular.ttf
